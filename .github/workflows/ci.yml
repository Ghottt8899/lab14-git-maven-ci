name: CI Process

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    branches:
      - develop
      - release/*

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1) CHECKSTYLE (validate фаз дээр жолоодог тул ok)
      - name: Run Checkstyle
        run: mvn -B checkstyle:check

      # 2) RUN ALL TESTS + JACOCO COVERAGE + COVERAGE CHECK
      # mvn verify → test + jacoco prepare-agent + report + check (rules) бүгдийг ажиллуулдаг
      - name: Run Tests + Coverage Verification
        run: mvn -B verify
